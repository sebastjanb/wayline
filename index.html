<body>
<div id="boot">Loading Wayline…</div>
<script>
// Runs before and apart from the app, so it still works when the app does not
// start. It keeps the offline copy up to date, and repairs a broken copy: a
// black screen with nothing on it must never be the end state.
(function () {
  var box = document.getElementById('boot'), problem = '';
  window.addEventListener('error', function (e) { problem = e.message || 'a file did not load'; }, true);
  var started = function () { return !!document.querySelector('.screen.active'); };
  var once = function (key) {
    try { if (sessionStorage.getItem(key)) return false; sessionStorage.setItem(key, '1'); } catch (e) {}
    return true;
  };

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    var hadWorker = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
    // A new version has just taken over: show it now, unless the wearer is mid-task.
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadWorker && !window.waylineBusy && once('wayline-updated')) location.reload();
    });
  }

  setTimeout(function () {
    if (started()) return;
    if (!once('wayline-repair')) {
      box.textContent = 'Wayline could not start. ' + (problem || 'Check the connection.') + ' Middle tap, Restart.';
      return;
    }
    box.textContent = 'Repairing Wayline…';
    var again = function () { location.reload(); };
    var jobs = [];
    try {
      if (window.caches) jobs.push(caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); }));
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); }));
    } catch (e) {}
    Promise.all(jobs).then(again, again);
  }, 15000);
})();
</script>
<div id="stage">
  <canvas id="map" aria-hidden="true"></canvas>

  <section class="screen" id="home">
    <div class="top-row">
      <button id="open-type" class="where">Where to?</button>
      <button id="open-phone" class="round" aria-label="Enter address on phone">
        <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M11 18.2h2"/></svg>
      </button>
      <button id="open-settings" class="round" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg>
      </button>
    </div>
    <button id="recenter" class="round side-left" aria-label="Centre on me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" class="solid"/><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5"/></svg>
    </button>
    <button id="zoom-in" class="round side-right-a" aria-label="Zoom in">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="zoom-out" class="round side-right-b" aria-label="Zoom out">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <div id="pins"></div>
    <div id="status" class="status" role="status"></div>
    <button id="enable-location" class="primary enable" hidden>Try again</button>
    <div id="debug" class="debug"></div>
    <div class="chips">
      <button data-category="cafes">Cafes</button>
      <button data-category="restaurants">Restaurants</button>
      <button data-category="parks">Parks</button>
      <button data-category="attractions">Attractions</button>
    </div>
  </section>

  <section class="screen" id="type">
    <input id="query" type="search" placeholder="Type an address or place" autocomplete="off" aria-label="Address or place">
    <div id="suggest"></div>
    <div id="keys"></div>
  </section>

  <section class="screen centered" id="phone">
    <div class="line-2">On your phone, open</div>
    <div id="phone-url" class="big-url"></div>
    <div class="line-2">and enter this code</div>
    <div id="phone-code" class="code"></div>
    <div id="phone-status" class="line-2"></div>
    <button id="phone-action">Cancel</button>
  </section>

  <section class="screen" id="results">
    <h1 id="results-title"></h1>
    <div id="results-list" class="list"></div>
  </section>

  <section class="screen" id="place">
    <div class="mode-pill" id="modes">
      <button data-mode="auto" aria-label="Drive">
        <svg viewBox="0 0 24 24"><path d="M4 16v-3l2-5h12l2 5v3M4 16h16M6.5 13h11"/><circle cx="7.5" cy="16.5" r="1.6" class="solid"/><circle cx="16.5" cy="16.5" r="1.6" class="solid"/></svg><span>Drive</span>
      </button>
      <button data-mode="pedestrian" aria-label="Walk">
        <svg viewBox="0 0 24 24"><circle cx="13" cy="4.3" r="2" class="solid"/><path d="M13 8.5l-3 3.5 3 3v5.5M10 12l-3 1.2M13 9.5l2.5 3 3 1M10.5 16l-2 5"/></svg><span>Walk</span>
      </button>
      <button data-mode="bicycle" aria-label="Bike">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.6"/><circle cx="18" cy="16" r="3.6"/><path d="M6 16l4-7h5l3 7M10 9l3 7M9 6h3"/></svg><span>Bike</span>
      </button>
    </div>
    <div class="card route-card">
      <div class="big-min"><b id="place-min"></b><small id="place-unit">min</small></div>
      <div class="route-text">
        <div id="place-summary" class="line-1"></div>
        <div id="place-eta" class="line-2"></div>
        <div id="place-name" class="line-2"></div>
      </div>
      <button id="start" class="go">GO</button>
    </div>
  </section>

  <section class="screen" id="nav">
    <div class="card turn">
      <div class="turn-icon" data-bind="turn-icon"></div>
      <div class="turn-text">
        <div class="line-1" data-bind="turn-street"></div>
        <div class="line-2" data-bind="turn-distance"></div>
      </div>
      <div class="turn-eta">
        <div class="line-1" data-bind="nav-min"></div>
        <div class="line-2" data-bind="nav-arrive"></div>
      </div>
    </div>
    <button id="look" class="look" aria-label="Look around the map">
      <svg viewBox="0 0 26 14"><path d="M4 11l9-7 9 7"/></svg><span id="look-hint">Swipe up to look around</span><span id="look-exit" class="look-exit" hidden>Select to return</span>
    </button>
    <div class="dock">
      <button id="exit" aria-label="End navigation">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span>End</span>
      </button>
      <button id="details" aria-label="Step by step">
        <svg viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.5" cy="7" r="1.3" class="solid"/><circle cx="4.5" cy="12" r="1.3" class="solid"/><circle cx="4.5" cy="17" r="1.3" class="solid"/></svg><span>Details</span>
      </button>
      <button id="compass" aria-label="Switch map orientation">
        <svg viewBox="0 0 24 24"><path class="solid" d="M12 2.5l4.6 9.5H7.4z"/><path d="M7.4 12l4.6 9.5 4.6-9.5z"/></svg><span id="compass-label">Compass</span>
      </button>
      <button id="mute" aria-label="Voice guidance">
        <svg viewBox="0 0 24 24"><path class="solid" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="mute-waves" d="M15.5 9a4.5 4.5 0 010 6M18 6.5a8 8 0 010 11"/><path id="mute-cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg><span id="mute-label">Sound</span>
      </button>
    </div>
  </section>

  <section class="screen" id="steps">
    <div class="card turn">
      <div class="turn-icon" data-bind="turn-icon"></div>
      <div class="turn-text">
        <div class="line-1" data-bind="turn-street"></div>
        <div class="line-2" data-bind="turn-distance"></div>
      </div>
      <div class="turn-eta">
        <div class="line-1" data-bind="nav-min"></div>
        <div class="line-2" data-bind="nav-arrive"></div>
      </div>
    </div>
    <div id="steps-list" class="steps"></div>
  </section>

  <section class="screen centered" id="arrived">
    <svg class="badge" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    <div class="big">You've arrived</div>
    <div id="arrived-name" class="line-2"></div>
    <button id="done" class="primary">Done</button>
  </section>

  <section class="screen" id="settings">
    <h1>Settings</h1>
    <div class="list">
      <button id="set-units"></button>
      <button id="set-voice"></button>
      <button id="set-orientation"></button>
      <button id="set-compass"></button>
      <button id="open-diag">Diagnostics</button>
    </div>
    <p class="credit">Map data © OpenStreetMap contributors. Tiles OpenFreeMap. Routing Valhalla. Search Photon.</p>
  </section>

  <section class="screen" id="diag">
    <h1>Diagnostics</h1>
    <pre id="diag-lines"></pre>
    <button id="diag-refresh" class="primary">Refresh</button>
  </section>

  <div id="toast" role="status"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
