<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1218">
<title>Wayline: send address</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<style>
  :root { --bg: #0f1218; --surface: #1c2027; --line: #2f3643; --text: #f4f6fa; --dim: #aab3c2; --accent: #3d9bff; --ok: #4cd08a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--text); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 4px 0 4px; }
  p { color: var(--dim); margin: 0 0 20px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--dim); margin: 16px 0 6px; }
  input { width: 100%; height: 52px; padding: 0 16px; font: inherit; font-size: 18px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  #code { letter-spacing: 4px; font-weight: 700; font-size: 22px; }
  #results { margin-top: 12px; display: grid; gap: 8px; }
  #results button { width: 100%; text-align: left; padding: 12px 16px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
  #results button:active { border-color: var(--accent); }
  #results strong { display: block; font-size: 17px; }
  #results span { display: block; font-size: 14px; color: var(--dim); }
  #status { margin-top: 16px; min-height: 24px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.bad { color: #ff7b72; }
</style>
</head>
<body>
<main>
  <h1>Send address to glasses</h1>
  <p>On the glasses, select the phone button on the home map. Enter the code shown there once; this phone remembers it.</p>

  <label for="code">Code from glasses</label>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000">

  <label for="address">Address or place</label>
  <input id="address" type="search" autocomplete="off" placeholder="Street, number, city">

  <div id="results"></div>
  <div id="status" role="status"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const PHOTON = 'https://photon.komoot.io/api/';
  const CODE_KEY = 'wayline.pairCode';
  let near = null, timer = 0, token = 0;

  try { $('code').value = localStorage.getItem(CODE_KEY) || ''; } catch {}
  ($('code').value ? $('address') : $('code')).focus();

  function status(text, kind = '') {
    $('status').textContent = text;
    $('status').className = kind;
  }

  $('code').addEventListener('input', () => {
    $('code').value = $('code').value.replace(/\D/g, '').slice(0, 6);
    try { localStorage.setItem(CODE_KEY, $('code').value); } catch {}
  });

  // Results near the phone come first, when the phone shares its location.
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((p) => { near = p.coords; }, () => {}, { timeout: 10000, maximumAge: 300000 });
  }

  $('address').addEventListener('input', () => {
    clearTimeout(timer);
    const query = $('address').value.trim();
    const mine = ++token;
    if (query.length < 3) { $('results').textContent = ''; return; }
    timer = setTimeout(async () => {
      const params = new URLSearchParams({ q: query, limit: '8', lang: 'en' });
      if (near) { params.set('lat', near.latitude.toFixed(5)); params.set('lon', near.longitude.toFixed(5)); }
      try {
        const json = await fetch(`${PHOTON}?${params}`).then((r) => r.json());
        if (mine !== token) return;
        show(json.features || []);
      } catch {
        status('Search needs a connection', 'bad');
      }
    }, 350);
  });

  function show(features) {
    $('results').textContent = '';
    status(features.length ? '' : 'No places found');
    for (const f of features) {
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      const street = [p.street, p.housenumber].filter(Boolean).join(' ');
      const name = p.name || street || p.city || 'Unnamed place';
      const detail = [p.name ? street : '', p.postcode, p.city || p.county, p.country].filter(Boolean).join(', ');
      const button = document.createElement('button');
      const title = document.createElement('strong');
      title.textContent = name;
      const sub = document.createElement('span');
      sub.textContent = detail;
      button.append(title, sub);
      button.addEventListener('click', () => send({ name, detail, lat, lon }));
      $('results').append(button);
    }
  }

  async function send(place) {
    const code = $('code').value;
    if (!/^\d{6}$/.test(code)) { status('Enter the 6-digit code from the glasses first', 'bad'); $('code').focus(); return; }
    status('Sending…');
    try {
      const response = await fetch('https://wayline-glasses.netlify.app/api/relay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, place }),
      });
      if (!response.ok) throw new Error(response.status);
      status(`Sent: ${place.name}. Glasses must be on the phone screen to receive it.`, 'ok');
    } catch {
      status('Could not send. Check the connection and try again.', 'bad');
    }
  }
</script>
</body>
</html>
